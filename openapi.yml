openapi: 3.1.0
info:
  title: µEd API - Educational Microservices
  version: 1.0.0
  contact:
    name: µEd API Maintainers
    url: https://github.com/maximiliansoelch/mEd-api
  description: >
    The µEd API ("microservices for education") is a specification
    for interoperable educational services.
    <br><br>
    Currently defined endpoints:<br>
    - **Task evaluation**: automatic feedback and grading for student submissions. <br>
    - **Chat**: conversational interactions around tasks, submissions, or general
      learning questions. <br>
    <br><br>
    Future endpoints (TBD): <br>
    - **Task/content generation** <br>
    - **Learning analytics / data analysis**

tags:
  - name: evaluation
    description: Endpoints for evaluating student submissions and generating feedback.
  - name: chat
    description: Conversational endpoints for educational dialogue.


paths:
  /evaluation:
    post:
      summary: Evaluate a submission and generate feedback
      operationId: evaluateSubmission
      description: >
        Generates a list of feedback items for a given student submission.
        Learner profiles and grading criteria are optional inputs.
      tags:
        - evaluation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvaluationRequest'
            examples:
              simpleTextSubmission:
                summary: Simple text submission without learner profile or criteria
                value:
                  submission:
                    submissionId: "sub-123"
                    exerciseId: "ex-42"
                    content:
                      type: "TEXT"
                      text: "Explain what polymorphism is in object-oriented programming."
                    submittedAt: "2025-12-16T09:30:00Z"
                    version: 1
                  customConfig: null
              previewExample:
                summary: Perform preview evaluation (non-final)
                value:
                  submission:
                    submissionId: "sub-777"
                    exerciseId: "ex-42"
                    content:
                      type: "TEXT"
                      text: "My short answer..."
                  preview: true
                  customConfig: null
              withExtras:
                summary: With learner profile, criteria and custom kwargs
                value:
                  submission:
                    submissionId: "sub-456"
                    exerciseId: "ex-99"
                    content:
                      type: "CODE"
                      files:
                        - path: "Main.java"
                          content: "public class Main { ... }"
                    submittedAt: "2025-12-16T10:00:00Z"
                    version: 2
                    totalScore: null
                  learnerProfile:
                    detailPreference: DETAILED
                    tonePreference: FRIENDLY
                    languagePreference: "en"
                  gradingCriteria:
                    - criterionId: "crit-1"
                      name: "Correctness"
                      description: "The solution produces correct results for the specified problem."
                      maxPoints: 10
                    - criterionId: "crit-2"
                      name: "Code Quality"
                      description: "The code is readable, well-structured, and follows style guidelines."
                      maxPoints: 5
                  customConfig:
                    model: "gpt-5-edu"
                    temperature: 0.2
                    enforceRubricStrictness: true
      responses:
        '200':
          description: Successfully generated feedback
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Feedback'
              examples:
                exampleResponse:
                  summary: Example feedback response
                  value:
                    - feedbackId: "fb-1"
                      title: "Clarify your definition"
                      message: "Your explanation of polymorphism is generally correct, but it would help to distinguish between subtype polymorphism and parametric polymorphism."
                      suggestedAction: "Add one or two concrete examples of polymorphism in Java, e.g., method overriding."
                      awardedPoints: 2.5
                      gradingCriterion:
                        criterionId: "crit-1"
                        name: "Correctness"
                        description: "The solution produces correct results for the specified problem."
                        maxPoints: 10
                      target:
                        artefactType: "TEXT"
                        locator:
                          type: "SPAN"
                          startIndex: 0
                          endIndex: 120
                    - feedbackId: "fb-2"
                      title: "Overall structure"
                      message: "The overall structure of your answer is clear and easy to follow."
                      suggestedAction: null
                      awardedPoints: null
                      gradingCriterion: null
                      target: null
        '400':
          description: Invalid request (e.g. missing submission content or invalid schema)
        '500':
          description: Internal server error
        '501':
          description: >
            The server does not support the evaluation method. This allows
            service providers to implement only subsets of the µEd API.

  /evaluation/health:
    get:
      summary: Health and capabilities of the evaluation service
      operationId: getEvaluationHealth
      description: >
        Returns health information and capabilities of this evaluation service.
        Clients can use this endpoint to discover whether the service supports
        optional features such as preview evaluation, formative feedback, and
        summative feedback.
      tags:
        - evaluation
      responses:
        '200':
          description: Evaluation service is reachable and reporting capabilities.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluationHealthResponse'
              examples:
                exampleHealth:
                  summary: Example healthy service with capabilities
                  value:
                    status: "ok"
                    message: "Service healthy"
                    version: "1.0.0"
                    capabilities:
                      supportsEvaluation: true
                      supportsPreviewEvaluation: false
                      supportsFormativeFeedback: true
                      supportsSummativeFeedback: true
                      supportedArtefactTypes:
                        - "TEXT"
                        - "CODE"
                        - "MODEL"
                      supportedLanguages:
                        - "en"
                        - "de"
        '503':
          description: Evaluation service is currently unavailable or unhealthy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluationHealthResponse'
              examples:
                exampleUnhealthy:
                  summary: Example degraded / unavailable service
                  value:
                    status: "unavailable"
                    message: "Database connection failed"
                    version: "1.0.0"
                    capabilities:
                      supportsEvaluation: false
                      supportsPreviewEvaluation: false
                      supportsFormativeFeedback: false
                      supportsSummativeFeedback: false
                      supportedArtefactTypes: []
                      supportedLanguages: []
        '501':
          description: >
            The server does not implement the health endpoint for evaluation.
            This allows providers to implement only parts of the µEd API.


  /chat:
    post:
      summary: Chat about tasks, submissions, or learning topics
      operationId: chat
      description: >
        Conversational endpoint for educational chat use cases. A conversation
        can be grounded in a specific exercise or submission, and may optionally
        use a learner profile to adapt tone and detail. Typical use cases
        include: asking follow-up questions on feedback, requesting hints,
        or clarifying concepts.
      tags:
        - chat


components:
  schemas:

    # ====== Request wrapper ======
    EvaluationRequest:
      type: object
      description: >
        Input for task evaluation. The submission is mandatory; learner
        profile, grading criteria, preview mode, and customConfig are optional.
      required:
        - submission
      properties:
        submission:
          $ref: '#/components/schemas/Submission'
        learnerProfile:
          description: >
            Optional learner preferences that can influence the style and
            detail of the generated feedback.
          anyOf:
            - $ref: '#/components/schemas/LearnerProfile'
            - type: "null"
        gradingCriteria:
          description: >
            Optional list of grading criteria that structure the assessment.
            If omitted or null, feedback may still be generated in a purely
            qualitative manner.
          anyOf:
            - type: array
              items:
                $ref: '#/components/schemas/GradingCriterion'
            - type: "null"
        preview:
          type: boolean
          description: >
            If true, the evaluation is performed in preview mode. A preview
            evaluation provides feedback without committing or finalizing any
            awarded points. If false or omitted, a normal evaluation is performed.
          default: false
        customConfig:
          description: >
            Optional key-value configuration dictionary that allows clients to
            provide provider-specific or experimental parameters. Not standardized.
          anyOf:
            - type: object
              additionalProperties: true
            - type: "null"

    EvaluationHealthResponse:
      type: object
      description: >
        Health status and capabilities of the evaluation service. This allows
        clients to discover which optional features are supported and whether
        the service is currently healthy.
      required:
        - status
        - capabilities
      properties:
        status:
          type: string
          description: Overall health status of the evaluation service.
          enum:
            - ok
            - degraded
            - unavailable
        message:
          type:
            - string
            - "null"
          description: Optional human-readable status message.
        version:
          type:
            - string
            - "null"
          description: Version of the evaluation service implementation.
        capabilities:
          $ref: '#/components/schemas/EvaluationCapabilities'

    EvaluationCapabilities:
      type: object
      description: >
        Capabilities of the evaluation service. Each flag indicates whether
        a given feature is supported. Lists may be empty if not applicable.
      required:
        - supportsEvaluation
        - supportsPreviewEvaluation
        - supportsFormativeFeedback
        - supportsSummativeFeedback
      properties:
        supportsEvaluation:
          type: boolean
          description: >
            Indicates whether the /evaluation endpoint is implemented and usable.
        supportsPreviewEvaluation:
          type: boolean
          description: >
            Indicates whether the service supports a "preview" mode for evaluation
            (e.g., a future endpoint or parameter to get feedback without committing
            grades). This spec does not yet standardize the preview API itself.
        supportsFormativeFeedback:
          type: boolean
          description: >
            Indicates whether the service supports purely formative feedback
            (qualitative comments without awarded points).
        supportsSummativeFeedback:
          type: boolean
          description: >
            Indicates whether the service supports summative feedback with
            awarded points / grading signals.
        supportedArtefactTypes:
          type:
            - array
            - "null"
          description: >
            List of artefact types that this evaluation service can handle.
            If null or empty, the supported types are unspecified.
          items:
            $ref: '#/components/schemas/ArtefactType'
        supportedLanguages:
          type:
            - array
            - "null"
          description: >
            List of language codes (e.g., 'en', 'de') that this service
            explicitly supports for feedback messages. If null or empty,
            language support is unspecified.
          items:
            type: string

    # ====== Core domain types ======

    Submission:
      type: object
      description: >
        A student's submission for an exercise. The structure of 'content' is
        intentionally generic and exercise/tool-specific.
      required:
        - submissionId
        - content
      properties:
        submissionId:
          type: string
          description: Unique identifier of the submission.
        exerciseId:
          type:
            - string
            - "null"
          description: >
            Optional identifier of the exercise this submission belongs to.
        content:
          type: object
          additionalProperties: true
          description: >
            Logical representation of the submission content. Its structure is
            defined by the exercise type (e.g., text answer, code files, model
            representation).
        submittedAt:
          type:
            - string
            - "null"
          format: date-time
          description: Timestamp when the submission was created.
        version:
          type:
            - integer
            - "null"
          format: int32
          description: Version number of the submission (e.g., for resubmissions).
        totalScore:
          type:
            - number
            - "null"
          format: double
          description: >
            Overall score already assigned to this submission, if any. May be
            omitted or null for formative feedback only.

    LearnerProfile:
      type: object
      description: >
        Optional learner preferences that can be used to adapt the style and
        level of detail of the generated feedback.
      required:
        - detailPreference
        - tonePreference
      properties:
        detailPreference:
          $ref: '#/components/schemas/FeedbackDetailPreference'
        tonePreference:
          $ref: '#/components/schemas/FeedbackTonePreference'
        languagePreference:
          type:
            - string
            - "null"
          description: >
            Preferred language code (e.g. 'en', 'de'). If null, the system may
            choose a default language.

    GradingCriterion:
      type: object
      description: >
        A grading criterion describing one dimension along which the submission
        is assessed (e.g., correctness, style, argumentation).
      required:
        - criterionId
        - name
      properties:
        criterionId:
          type: string
          description: Unique identifier of the grading criterion.
        name:
          type: string
          description: Human-readable name of the criterion.
        description:
          type:
            - string
            - "null"
          description: Detailed description of the criterion.
        maxPoints:
          type:
            - number
            - "null"
          format: double
          description: >
            Maximum number of points that can be awarded for this criterion.
            May be omitted if the feedback is purely qualitative.

    Feedback:
      type: object
      description: >
        A single feedback item produced for the submission. May contain a
        textual message, an optional suggested action, and optionally points
        awarded under a given grading criterion, and/or a target within the
        submission.
      required:
        - feedbackId
        - message
      properties:
        feedbackId:
          type: string
          description: Unique identifier of the feedback item.
        title:
          type:
            - string
            - "null"
          description: Short summary or label for this feedback item.
        message:
          type: string
          description: Main feedback text shown to the student.
        suggestedAction:
          type:
            - string
            - "null"
          description: >
            Optional suggestion for how the learner can act on this feedback
            (e.g., "Split this method into smaller functions.").
        awardedPoints:
          type:
            - number
            - "null"
          format: double
          description: >
            Points awarded for the part of the submission referenced by this
            feedback item. Null for purely formative feedback.
        gradingCriterion:
          description: >
            The grading criterion under which this feedback item is evaluated,
            if any.
          anyOf:
            - $ref: '#/components/schemas/GradingCriterion'
            - type: "null"
        target:
          description: >
            Optional reference to a specific part of the submission that this
            feedback item refers to (e.g., a text span, a code region, a model
            element).
          anyOf:
            - $ref: '#/components/schemas/FeedbackTarget'
            - type: "null"

    FeedbackTarget:
      type: object
      description: >
        Optional reference to a specific part of the submission that this
        feedback item refers to. The interpretation of 'locator' depends on
        'artefactType' and the structure of the submission content.
      required:
        - artefactType
      properties:
        artefactType:
          $ref: '#/components/schemas/ArtefactType'
        locator:
          description: >
            Opaque locator structure used to identify the relevant fragment
            within the submission content. Examples: character offsets for
            text, file + line range for code, element id for models.
          anyOf:
            - type: object
              additionalProperties: true
            - type: "null"

    # ====== Enums ======

    ArtefactType:
      type: string
      description: Type of artefact within the submission that the feedback refers to.
      enum:
        - TEXT
        - CODE
        - MODEL
        - MATH
        - OTHER

    FeedbackDetailPreference:
      type: string
      description: Level of detail preferred by the learner.
      enum:
        - BRIEF
        - MEDIUM
        - DETAILED

    FeedbackTonePreference:
      type: string
      description: Preferred tone for feedback messages.
      enum:
        - FORMAL
        - NEUTRAL
        - FRIENDLY

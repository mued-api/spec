openapi: 3.1.0
info:
  title: µEd API - Educational Microservices
  version: 0.1.0
  contact:
    name: µEd API Maintainers
  description: >
    The µEd API ("microservices for education") is a specification
    for interoperable educational services.
    <br><br>
    Currently defined endpoints:<br>
    - **Task evaluation**: automatic feedback and grading for student submissions. <br>
    - **Chat**: conversational interactions around tasks, submissions, or general
      learning questions. <br>
    <br><br>
    Future endpoints (TBD): <br>
    - **Task/content generation** <br>
    - **Task/content recommendation** <br>
    - **Learning analytics**

tags:
  - name: evaluation
    description: Endpoints for evaluating student submissions and generating feedback.
  - name: chat
    description: Conversational endpoints for educational dialogue.

paths:
  /evaluate:
    post:
      summary: Evaluate a submission and generate feedback
      operationId: evaluateSubmission
      description: >
        Generates a list of feedback items for a given student submission.
        The request can optionally include the task context, user information,
        evaluation criteria, pre-submission feedback options, and configuration.
      tags:
        - evaluation
      parameters:
        - in: header
          name: Authorization
          schema:
            type: string
          required: false
          description: Optional authorization header.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvaluationRequest"
            examples:
              simpleTextSubmission:
                summary: Simple text submission without user or criteria
                value:
                  submission:
                    submissionId: "sub-123"
                    taskId: "task-42"
                    type: "TEXT"
                    content:
                      text: "Explain what polymorphism is in object-oriented programming."
                    submittedAt: "2025-12-16T09:30:00Z"
                    version: 1
                  configuration: null

              preSubmissionFeedbackExample:
                summary: Pre-submission feedback (non-final)
                value:
                  submission:
                    submissionId: "sub-777"
                    taskId: "task-42"
                    type: "TEXT"
                    content:
                      text: "My short answer..."
                  preSubmissionFeedback:
                    enabled: true
                  configuration:
                    llm:
                      model: "gpt-5.2"
                      temperature: 0.4

              withTaskAndExtras:
                summary: With task context, user, criteria and configuration
                value:
                  task:
                    taskId: "task-12"
                    title: "Explain polymorphism"
                    content:
                      text: "Define polymorphism and give at least one example in Java."
                    learningObjectives:
                      - "Explain the concept of polymorphism."
                      - "Provide an example of subtype polymorphism in Java."
                    referenceSolution:
                      text: >
                        Polymorphism allows the same method call to result in different behavior
                        depending on the object's runtime type. For example, a variable of type
                        Shape can reference a Circle or Rectangle, and calling draw() will invoke
                        the appropriate implementation.
                    context:
                      constraints: "Answer in 3-6 sentences."
                      language: "en"
                  submission:
                    submissionId: "sub-456"
                    taskId: "task-12"
                    type: "TEXT"
                    content:
                      text: >
                        Polymorphism means that an object can take many forms, for example
                        subclasses implementing methods differently.
                    submittedAt: "2025-12-16T10:00:00Z"
                    version: 2
                  user:
                    userId: "user-789"
                    type: LEARNER
                    detailPreference: DETAILED
                    tonePreference: FRIENDLY
                    languagePreference: "en"
                  criteria:
                    - criterionId: "crit-1"
                      name: "Correctness"
                      context: "The explanation of polymorphism is conceptually correct."
                      maxPoints: 10
                    - criterionId: "crit-2"
                      name: "Clarity"
                      context: "The explanation is clear, well-structured, and easy to understand."
                      maxPoints: 5
                  preSubmissionFeedback:
                    enabled: false
                  configuration:
                    llm:
                      model: "gpt-5.2"
                      temperature: 0.2
                      maxTokens: 800
                      credentials:
                        apiKey: "OPENAI_API_KEY"
                    enforceRubricStrictness: true
      responses:
        "200":
          description: Successfully generated feedback.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Feedback"
              examples:
                exampleResponse:
                  summary: Example feedback response
                  value:
                    - feedbackId: "fb-1"
                      title: "Clarify your definition"
                      message: "Your explanation of polymorphism is generally correct, but it would help to distinguish between subtype polymorphism and parametric polymorphism."
                      suggestedAction: "Add one or two concrete examples of polymorphism in Java, e.g., method overriding."
                      awardedPoints: 2.5
                      criterion:
                        criterionId: "crit-1"
                        name: "Correctness"
                        context: "The solution produces correct results for the specified problem."
                        maxPoints: 10
                      target:
                        artefactType: "TEXT"
                        locator:
                          type: "SPAN"
                          startIndex: 0
                          endIndex: 120
                    - feedbackId: "fb-2"
                      title: "Overall structure"
                      message: "The overall structure of your answer is clear and easy to follow."
        "400":
          description: Invalid request (e.g. missing content or invalid schema).
        "500":
          description: Internal server error.
        "501":
          description: >
            The server does not support the evaluate method. This allows
            service providers to implement only subsets of the µEd API.

  /evaluate/health:
    get:
      summary: Health and capabilities of the evaluation service
      operationId: getEvaluationHealth
      description: >
        Returns health information and capabilities of the evaluation service.
        Clients can use this endpoint to discover whether the service supports
        optional features such as pre-submission feedback, formative feedback,
        and summative feedback.
      tags:
        - evaluation
      responses:
        "200":
          description: Evaluation service is reachable and reporting capabilities.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvaluationHealthResponse"
              examples:
                exampleHealth:
                  summary: Example healthy service with capabilities
                  value:
                    status: "ok"
                    message: "Service healthy"
                    version: "1.0.0"
                    capabilities:
                      supportsEvaluation: true
                      supportsPreviewEvaluation: false
                      supportsFormativeFeedback: true
                      supportsSummativeFeedback: true
                      supportedArtefactTypes:
                        - "TEXT"
                        - "CODE"
                        - "MODEL"
                      supportedLanguages:
                        - "en"
                        - "de"
        "503":
          description: Evaluation service is currently unavailable or unhealthy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvaluationHealthResponse"
              examples:
                exampleUnhealthy:
                  summary: Example degraded / unavailable service
                  value:
                    status: "unavailable"
                    message: "Database connection failed"
                    version: "1.0.0"
                    capabilities:
                      supportsEvaluation: false
                      supportsPreviewEvaluation: false
                      supportsFormativeFeedback: false
                      supportsSummativeFeedback: false
                      supportedArtefactTypes: []
                      supportedLanguages: []
        "501":
          description: The server does not implement the health endpoint for evaluation.

  /chat:
    post:
      summary: Chat about tasks, submissions, or learning topics
      operationId: chat
      description: >
        Conversational endpoint for educational chat use cases. A conversation can be
        grounded in a specific course, task or submission and may use user information
        to adapt tone and detail. Typical use cases include: asking follow-up questions
        on feedback, requesting hints, or clarifying concepts.
      tags:
        - chat
      parameters:
        - in: header
          name: Authorization
          schema:
            type: string
          required: false
          description: Optional authorization header.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatRequest"
            examples:
              minimalChat:
                summary: Minimal chat request
                value:
                  messages:
                    - role: user
                      content: "Can you explain polymorphism?"
                  configuration: null

              chatWithLlmConfig:
                summary: Chat request with optional LLM configuration
                value:
                  conversationId: "conv-1001"
                  user:
                    userId: "user-456"
                    type: LEARNER
                    detailPreference: MEDIUM
                    tonePreference: FRIENDLY
                    languagePreference: "en"
                  messages:
                    - role: user
                      content: "Give me a hint for my answer about polymorphism."
                  context:
                    task:
                      taskId: "task-12"
                      title: "Explain polymorphism"
                      content:
                        text: "Define polymorphism and give at least one example in Java."
                  configuration:
                    llm:
                      model: "gpt-5.2"
                      temperature: 0.7
                      stream: false
                      credentials:
                        apiKey: "OPENAI_API_KEY"
              chatWithContext:
                summary: Chat request with complex educational context
                value:
                  messages:
                    - role: user
                      content: "What should I do for this part?"
                  user:
                    userId: "user-321"
                    type: LEARNER
                    detailPreference: DETAILED
                    tonePreference: NEUTRAL
                    languagePreference: "en"
                    taskProgress:
                      currentQuestionId: "question-321"
                      timeSpentOnQuestion: "30 minutes"
                      currentPart:
                        partId: "part-1"
                        timeSpentOnPart: "10 minutes"
                        submission:
                          type: "TEXT"
                          content:
                            text: 'outputs= ["Woof!", "Meow!"]'
                          feedback:
                            - feedbackId: "fb-101"
                              message: "Incomplete answer, explain why these outputs occur."
                  context:
                    module:
                      moduleId: "module-456"
                      title: "Introduction to Object-Oriented Programming (OOP)"
                    set:
                      setId: "set-789"
                      title: "Fundamentals"
                    question:
                      questionId: "question-321"
                      title: "Understanding Polymorphism"
                      content: >
                        Answer the questions for the following example of polymorphism in Python.

                        ```python
                        class Animal:
                            def speak(self):
                                pass

                        class Dog(Animal):
                            def speak(self):
                                return "Woof!"

                        class Cat(Animal):
                            def speak(self):
                                return "Meow!"

                        animals = [Dog(), Cat()]
                        for animal in animals:
                            print(animal.speak())
                        ```
                      estimatedTime: "15-25 minutes"
                      parts:
                        - partId: "part-1"
                          content: >
                            Looking at the code example, identify which method is being overridden
                            and explain how this demonstrates polymorphism. What output would the
                            code produce and why?

                        - partId: "part-2"
                          content: >
                            Write a new class called `Bird` that inherits from `Animal` and
                            overrides the `speak()` method to return "Tweet!". Then add an
                            instance of `Bird` to the animals list.
                          referenceSolution:
                            code: |
                              class Bird(Animal):
                                  def speak(self):
                                      return "Tweet!"

                              animals = [Dog(), Cat(), Bird()]
                              for animal in animals:
                                  print(animal.speak())
                  configuration:
                    llm:
                      model: "gpt-5.2"
                      temperature: 0.5
      responses:
        "200":
          description: Successful chat response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatResponse"
        "400":
          description: Invalid request (e.g. missing messages or invalid schema).
        "500":
          description: Internal server error (e.g. model provider issues).

  /chat/health:
    get:
      summary: Health and capabilities of the chat service
      operationId: getChatHealth
      description: >
        Returns health information and capabilities of the chat service.
        Clients can use this endpoint to discover whether the service supports
        optional features such as user preferences or streaming responses.
      tags:
        - chat
      responses:
        "200":
          description: Chat service is reachable and reporting capabilities.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatHealthResponse"
              examples:
                exampleHealth:
                  summary: Example healthy service with capabilities
                  value:
                    status: "ok"
                    statusMessage: "Service healthy"
                    version: "1.0.0"
                    capabilities:
                      supportsChat: true
                      supportsUserPreferences: true
                      supportsStreaming: true
                      supportedLanguages:
                        - "en"
                        - "de"
                      supportedModels:
                        - "gpt-4o"
                        - "llama-3"
        "503":
          description: Chat service is currently unavailable or unhealthy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatHealthResponse"
              examples:
                exampleUnhealthy:
                  summary: Example degraded / unavailable service
                  value:
                    status: "unavailable"
                    statusMessage: "LLM provider connection failed"
                    version: "1.0.0"
                    capabilities:
                      supportsChat: false
                      supportsUserPreferences: false
                      supportsStreaming: false
                      supportedLanguages: []
                      supportedModels: []
        "501":
          description: The server does not implement the health endpoint for chat.

components:
  schemas:
    # --- Endpoint request/response wrappers ---
    EvaluationRequest:
      type: object
      description: >
        Input for task evaluation. The submission is mandatory; task,
        user, criteria, pre-submission feedback options, and
        configuration are optional.
      required:
        - submission
      properties:
        task:
          description: >
            Optional task context that can include prompt content, learning objectives,
            a reference solution, and additional context metadata.
          type:
            - object
            - "null"
          allOf:
            - $ref: "#/components/schemas/Task"
        submission:
          $ref: "#/components/schemas/Submission"
        user:
          description: Optional user information including type and preferences that can influence response tone, detail, and language.
          type:
            - object
            - "null"
          allOf:
            - $ref: "#/components/schemas/User"
        criteria:
          type:
            - array
            - "null"
          description: Optional criteria used for evaluation.
          items:
            $ref: "#/components/schemas/Criterion"
        preSubmissionFeedback:
          description: >
            Optional settings for pre-submission feedback (non-final). When enabled,
            the service should avoid committing or finalizing grades.
          type:
            - object
            - "null"
          allOf:
            - $ref: "#/components/schemas/PreSubmissionFeedback"
        configuration:
          description: >
            Optional key-value configuration dictionary for provider-specific or
            experimental parameters. Not standardized.
          type:
            - object
            - "null"
          additionalProperties: true
          properties:
            llm:
              description: Optional LLM configuration used for this request.
              type:
                - object
                - "null"
              allOf:
                - $ref: "#/components/schemas/LLMConfiguration"
            dataPolicy:
              description: Optional data policy governing how this request's data may be processed and retained.
              type:
                - object
                - "null"
              allOf:
                - $ref: "#/components/schemas/DataPolicy"

    ChatRequest:
      type: object
      description: Request body for the chat endpoint.
      required:
        - messages
      properties:
        messages:
          type: array
          description: List of messages in the conversation (including history).
          items:
            $ref: "#/components/schemas/Message"
        conversationId:
          type:
            - string
            - "null"
          description: Optional identifier for the conversation session.
        user:
          description: Optional user information to adapt the chat style and level.
          type:
            - object
            - "null"
          allOf:
            - $ref: "#/components/schemas/User"
        context:
          type:
            - object
            - "null"
          description: Optional educational context (e.g., course material, task context).
          additionalProperties: true
        configuration:
          type:
            - object
            - "null"
          description: Optional configuration for the model(s).
          additionalProperties: true
          properties:
            llm:
              description: Optional LLM configuration used for this request.
              type:
                - object
                - "null"
              allOf:
                - $ref: "#/components/schemas/LLMConfiguration"
            dataPolicy:
              description: Optional data policy governing how this request's data may be processed and retained.
              type:
                - object
                - "null"
              allOf:
                - $ref: "#/components/schemas/DataPolicy"

    ChatResponse:
      type: object
      description: Response body for the chat endpoint.
      required:
        - response
      properties:
        response:
          $ref: "#/components/schemas/Message"
          description: The generated assistant response.
        metadata:
          type:
            - object
            - "null"
          description: Optional metadata about response generation.
          additionalProperties: true

    # --- Health responses + subtypes ---
    EvaluationHealthResponse:
      type: object
      description: Health status and capabilities of the evaluation service.
      required:
        - status
        - capabilities
      properties:
        status:
          type: string
          description: Overall health status of the evaluation service.
          enum: [ok, degraded, unavailable]
        message:
          type:
            - string
            - "null"
          description: Optional human-readable status message.
        version:
          type:
            - string
            - "null"
          description: Optional version of the evaluation service implementation.
        requirements:
          type:
            - object
            - "null"
          description: Optional requirements clients must satisfy to use this service.
          allOf:
            - $ref: "#/components/schemas/EvaluationRequirements"
        capabilities:
          $ref: "#/components/schemas/EvaluationCapabilities"

    EvaluationRequirements:
      type: object
      description: >
        Requirements for calling the evaluation endpoint, e.g. whether an
        Authorization header and/or LLM configuration or credentials are required.
      additionalProperties: true
      properties:
        requiresAuthorizationHeader:
          type:
            - boolean
            - "null"
          description: Optional flag indicating whether an Authorization header is required.
        requiresLlmConfiguration:
          type:
            - boolean
            - "null"
          description: Optional flag indicating whether configuration.llm must be provided.
        requiresLlmCredentials:
          type:
            - boolean
            - "null"
          description: Optional flag indicating whether configuration.llm.credentials must be provided.

    EvaluationCapabilities:
      type: object
      description: Capabilities of the evaluation service.
      required:
        - supportsEvaluation
        - supportsPreviewEvaluation
        - supportsFormativeFeedback
        - supportsSummativeFeedback
        - supportsDataPolicy
      properties:
        supportsEvaluation:
          type: boolean
          description: Indicates whether the /evaluate endpoint is implemented and usable.
        supportsPreviewEvaluation:
          type: boolean
          description: Indicates whether the service supports pre-submission feedback runs.
        supportsFormativeFeedback:
          type: boolean
          description: Indicates whether the service supports qualitative feedback without points.
        supportsSummativeFeedback:
          type: boolean
          description: Indicates whether the service supports feedback with points / grading signals.
        supportsDataPolicy:
          type: string
          enum: [TRUE, FALSE, PARTIAL]
          additionalProperties: true
          description: Indicates whether the service supports data policy configuration.
        supportedArtefactTypes:
          type:
            - array
            - "null"
          description: Optional list of supported artefact types.
          items:
            $ref: "#/components/schemas/ArtefactType"
        supportedLanguages:
          type:
            - array
            - "null"
          description: Optional list of supported language codes (e.g., 'en', 'de').
          items:
            type: string

    ChatHealthResponse:
      type: object
      description: Health status and capabilities of the chat service.
      required:
        - status
        - capabilities
      properties:
        status:
          type: string
          enum: [ok, degraded, unavailable]
        statusMessage:
          type:
            - string
            - "null"
          description: Optional human-readable status message.
        version:
          type:
            - string
            - "null"
          description: Optional version of the chat service implementation.
        capabilities:
          $ref: "#/components/schemas/ChatCapabilities"

    ChatCapabilities:
      type: object
      description: Capabilities of the chat service.
      required:
        - supportsChat
        - supportsDataPolicy
      properties:
        supportsChat:
          type: boolean
          description: Indicates whether the /chat endpoint is implemented and usable.
        supportsUserPreferences:
          type: boolean
          description: Indicates whether the service supports adapting to user preferences.
        supportsStreaming:
          type: boolean
          description: Indicates whether the service supports streaming responses.
        supportsDataPolicy:
          type: string
          enum: [TRUE, FALSE, PARTIAL]
          additionalProperties: true
          description: Indicates whether the service supports data policy configuration.
        supportedLanguages:
          type:
            - array
            - "null"
          description: Optional list of supported language codes.
          items:
            type: string
        supportedModels:
          type:
            - array
            - "null"
          description: Optional list of supported models.
          items:
            type: string

    # --- Shared configuration objects ---
    LLMConfiguration:
      type: object
      description: >
        Optional configuration for an LLM provider. All fields are optional and
        provider-specific values may be included via additional properties.
      additionalProperties: true
      properties:
        model:
          type:
            - string
            - "null"
          description: Optional model identifier (e.g., 'gpt-4o', 'llama-3').
        temperature:
          type:
            - number
            - "null"
          description: Optional sampling temperature.
        maxTokens:
          type:
            - integer
            - "null"
          description: Optional maximum number of tokens to generate.
        stream:
          type:
            - boolean
            - "null"
          description: Optional flag indicating whether streaming responses are requested.
        credentials:
          type:
            - object
            - "null"
          description: Optional credentials object (e.g., API keys, tokens).
          additionalProperties: true

    PreSubmissionFeedback:
      type: object
      description: Optional configuration for pre-submission feedback runs.
      required:
        - enabled
      properties:
        enabled:
          type: boolean
          description: Indicates whether pre-submission feedback is requested.
      additionalProperties: true

    # --- Core domain objects ---
    Task:
      type: object
      description: >
        Task context including the content, learning objectives,
        optional reference solution, optional context information, and optional metadata.
      required:
        - title
      properties:
        taskId:
          type: string
          description: Optional unique identifier for the task.
        title:
          type: string
          description: Short title or label for the task.
        content:
          type:
            - object
            - "null"
          description: Optional content shown to the learner (structure is task-specific).
          additionalProperties: true
        context:
          type:
            - object
            - "null"
          description: Optional educational context (e.g., course material).
          additionalProperties: true
        learningObjectives:
          type:
            - array
            - "null"
          description: Optional list of learning objectives addressed by this task.
          items:
            type: string
        referenceSolution:
          type:
            - object
            - "null"
          description: Optional reference or example solution (structure is task-specific).
          additionalProperties: true
        metadata:
          type:
            - object
            - "null"
          description: Optional metadata such as difficulty, topic, tags, etc.
          additionalProperties: true

    Submission:
      type: object
      description: >
        A student's submission for a task. The structure of 'content' is intentionally
        generic and task-specific.
      required:
        - type
        - content
      properties:
        submissionId:
          type: string
          description: Optional unique identifier of the submission.
        taskId:
          type:
            - string
            - "null"
          description: Optional identifier of the task this submission belongs to.
        type:
          $ref: "#/components/schemas/ArtefactType"
        content:
          type: object
          additionalProperties: true
          description: Logical representation of the submission content.
        submittedAt:
          type:
            - string
            - "null"
          format: date-time
          description: Optional timestamp when the submission was created.
        version:
          type:
            - integer
            - "null"
          format: int32
          description: Optional version number (e.g., resubmissions).

    User:
      type: object
      description: User information including type and optional preferences influencing response tone, detail, and language.
      required:
        - type
      properties:
        userId:
          type:
            - string
            - "null"
          description: Optional unique identifier for the user.
        type:
          $ref: "#/components/schemas/UserType"
        detailPreference:
          description: Optional preferred level of detail in responses.
          $ref: "#/components/schemas/ResponseDetailPreference"
        tonePreference:
          description: Optional preferred tone for responses.
          $ref: "#/components/schemas/ResponseTonePreference"
        languagePreference:
          type:
            - string
            - "null"
          description: Optional preferred language code (e.g., 'en', 'de').
        taskProgress:
          type:
            - object
            - "null"
          description: Optional information about the user's progress on this task/topic.
          additionalProperties: true
      additionalProperties: true

    Criterion:
      type: object
      description: A criterion used to assess one dimension of a submission.
      required:
        - name
      properties:
        criterionId:
          type: string
          description: Optional unique identifier of the criterion.
        name:
          type: string
          description: Human-readable name of the criterion.
        context:
          type:
            - string
            - "null"
          description: Optional additional context about how to apply this criterion.
        maxPoints:
          type:
            - number
            - "null"
          format: double
          description: Optional maximum points for this criterion.

    Feedback:
      type: object
      description: >
        A single feedback item produced for the submission. It may include
        suggested actions, optional points, optional criterion linkage, and
        optional targeting into the submission.
      required:
        - feedbackId
      properties:
        feedbackId:
          type: string
          description: Unique identifier of the feedback item.
        title:
          type:
            - string
            - "null"
          description: Optional short label for this feedback item.
        message:
          type:
            - string
            - "null"
          description: Optional feedback text shown to the learner.
        suggestedAction:
          type:
            - string
            - "null"
          description: Optional suggestion for how to act on this feedback.
        awardedPoints:
          type:
            - number
            - "null"
          format: double
          description: Optional points awarded for this feedback item.
        criterion:
          type:
            - object
            - "null"
          description: Optional criterion linked to this feedback item.
          allOf:
            - $ref: "#/components/schemas/Criterion"
        target:
          type:
            - object
            - "null"
          description: Optional target reference inside the submission.
          allOf:
            - $ref: "#/components/schemas/FeedbackTarget"

    FeedbackTarget:
      type: object
      description: Optional reference to a specific part of the submission.
      required:
        - artefactType
      properties:
        artefactType:
          $ref: "#/components/schemas/ArtefactType"
        locator:
          type:
            - object
            - "null"
          description:
            "Optional opaque locator into the submission content. Examples: character offsets for
            text, file + line range for code, element id for models."
          additionalProperties: true

    Message:
      type: object
      required:
        - role
        - content
      properties:
        role:
          type: string
          enum: [user, assistant, system, tool]
        content:
          type: string

    DataPolicy:
      type: object
      description: >
        Declares what downstream services are allowed to do with data associated with this request:
        which legal regimes apply, what uses are permitted, how long data may be retained,
        where it may be processed, and what constraints apply (especially for children / sensitive data).
      additionalProperties: true
      properties:
        legal:
          type:
            - object
            - "null"
          description: Legal framework and authority governing this data.
          properties:
            applicableLaws:
              type: array
              description: One or more applicable legal regimes.
              items:
                type: string
                enum: [GDPR, UK_GDPR, EPRIVACY, CCPA_CPRA, COPPA, FERPA, PPRA, PIPEDA, LGPD, POPIA, APPI, PIPL, OTHER]
            legalBasis:
              type:
                - array
                - "null"
              description: Optional but recommended legal basis for processing.
              items:
                type: string
                enum: [consent, contract, legal_obligation, public_task, legitimate_interests, vital_interests, other]
        jurisdiction:
          type:
            - object
            - "null"
          description: Geographic constraints for data subjects and processing.
          properties:
            dataSubjectRegions:
              type:
                - array
                - "null"
              description: Where the data subjects are located.
              items:
                $ref: '#/components/schemas/Region'
            allowedProcessingRegions:
              type:
                - array
                - "null"
              description: Where processing/storage is allowed.
              items:
                $ref: '#/components/schemas/Region'
            disallowedProcessingRegions:
              type:
                - array
                - "null"
              description: Explicit exclusions for processing regions.
              items:
                $ref: '#/components/schemas/Region'
        dataSubject:
          type:
            - object
            - "null"
          description: Information about who this data is about.
          properties:
            population:
              type:
                - string
                - "null"
              description: Type of population this data concerns.
              enum: [student, staff, guardian, mixed, other]
            isChildData:
              type:
                - boolean
                - "null"
              description: Indicates whether this data concerns children.
            minAge:
              type:
                - integer
                - "null"
              description: Minimum age of data subjects, if relevant/known.
        dataCategory:
          type:
            - object
            - "null"
          description: Classification of the type of data.
          properties:
            classification:
              type:
                - string
                - "null"
              description: Primary classification of the data.
              enum: [anonymous, pseudonymous, personal, education_record, sensitive,other]
              additionalProperties: true
        retentionPermission:
          type:
            - array
            - "null"
          description: What retention and secondary uses are permitted.
          items:
            type: string
            enum: [never, security, logging, product-improvement-no-share, product-improvement-share-limited, research-confidential, public, other]
        retention:
          type:
            - object
            - "null"
          description: How long data may be retained.
          properties:
            maxRetention:
              type:
                - string
                - "null"
              description: Maximum retention period classification.
              enum: [transient, short, medium, long, indefinite]
            timeToLiveDays:
              type:
                - integer
                - "null"
              description: Concrete time-to-live in days, if specified.
            deleteOnRequest:
              type:
                - boolean
                - "null"
              description: Whether data must be deleted on user request.
            legalHoldAllowed:
              type:
                - boolean
                - "null"
              description: Whether legal holds are permitted on this data.
        sharing:
          type:
            - object
            - "null"
          description: Constraints on who can receive this data.
          properties:
            thirdPartySharing:
              type:
                - string
                - "null"
              description: Third-party sharing policy.
              enum: [prohibited, allowed, allowed-limited]
            subprocessorsAllowed:
              type:
                - boolean
                - "null"
              description: Whether subprocessors are allowed.
            allowedRecipients:
              type:
                - array
                - "null"
              description: Categories of allowed recipients.
              items:
                type: string
                enum: [controller-only, internal-services, named-partners, public]
        deidentification:
          type:
            - object
            - "null"
          description: Required deidentification for specific uses.
          properties:
            requiredForProductImprovement:
              type:
                - string
                - "null"
              description: Deidentification required for product improvement.
              enum: [none, pseudonymized, anonymized]
            requiredForResearch:
              type:
                - string
                - "null"
              description: Deidentification required for research.
              enum: [pseudonymized, anonymized, aggregated]

    Region:
      type: string
      description: >
        Geographic regions using ISO 3166-1 alpha-2 country codes (e.g., US, GB, DE)
        or regional groupings (e.g., EEA, EU, APAC).

    # --- Enums ---
    ArtefactType:
      type: string
      description: Type of artefact within the submission that feedback refers to.
      enum: [TEXT, CODE, MODEL, MATH, OTHER]

    UserType:
      type: string
      description: Type of user interacting with the API.
      enum: [LEARNER, TEACHER, EDU_ADMIN, SYS_ADMIN, OTHER]

    ResponseDetailPreference:
      type: string
      description: Level of detail preferred in responses.
      enum: [BRIEF, MEDIUM, DETAILED]

    ResponseTonePreference:
      type: string
      description: Preferred tone for responses.
      enum: [FORMAL, NEUTRAL, FRIENDLY]

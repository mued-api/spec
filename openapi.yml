openapi: 3.2.0
info:
  title: µEd API - Educational Microservices
  version: 0.1.0
  contact:
    name: µEd API Maintainers
  description: >
    The µEd API ("microservices for education") is a specification
    for interoperable educational services.
    <br><br>
    Currently defined endpoints:<br>
    - **Evaluate Task**: automatic feedback and grading for student submissions. <br>
    - **Chat**: conversational interactions around tasks, submissions, or general
      learning questions.
    <br><br>
    **Progress streaming.** Any operation MAY support an opt-in Server-Sent
    Events progress stream, selected per request with the
    `Accept: text/event-stream` header and modeled with the OpenAPI 3.2
    `itemSchema` event form. The stream is a sequence of progress events
    (`SseProgressStep` data), optional keep-alive comments, and exactly one
    terminal event: `completed` carrying the operation's normal `200` body, or
    `failed` carrying an `ErrorResponse`. Errors detected before the stream
    opens use normal HTTP status codes; once it opens, the status stays `200`.
    Streaming cannot be combined with `callbackUrl` (such requests get `400`).
    Services advertise support via `supportsStreaming` in their `/info`
    capabilities. This is distinct from `configuration.llm.stream`, which
    governs token-level streaming from the LLM provider.

tags:
  - name: evaluate
    description: Endpoints for evaluating student submissions and generating feedback.
  - name: chat
    description: Conversational endpoints for educational dialogue.


type: object
description: >
  Describes support for a set of submission formats. Used in health/capabilities
  responses to advertise what a service can handle.
properties:
  supportedFormats:
    type:
      - array
      - "null"
    description: >
      List of supported formats, using the same namespaced "<category>:<format>"
      convention as Submission.format (see Submission.yml). A category-wildcard
      entry (e.g. "code:*") means the service accepts any format in that
      category. If null or empty, the service accepts any format.
    items:
      type: string
    examples:
      - ["text:plain", "text:markdown"]
      - ["code:python", "code:java", "code:javascript", "code:sympy"]
      - ["math:latex", "math:mathml"]
  contentSchema:
    type:
      - object
      - "null"
    description: >
      Optional JSON Schema describing the expected content structure for this
      artefact type. Allows services to advertise their exact requirements.
    additionalProperties: true
  locatorSchema:
    type:
      - object
      - "null"
    description: >
      Optional JSON Schema describing the locator structure used for feedback
      targeting within this artefact type.
    additionalProperties: true

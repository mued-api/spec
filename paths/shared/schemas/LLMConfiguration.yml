type: object
description: >
  Optional configuration for an LLM provider. All fields are optional and
  provider-specific values may be included via additional properties.
additionalProperties: true
properties:
  model:
    type:
      - string
      - "null"
    description: Optional model identifier (e.g., 'gpt-4o', 'llama-3').
  temperature:
    type:
      - number
      - "null"
    description: Optional sampling temperature.
  maxTokens:
    type:
      - integer
      - "null"
    description: Optional maximum number of tokens to generate.
  stream:
    type:
      - boolean
      - "null"
    description: >
      Optional flag requesting token-level streaming from the underlying LLM
      provider. This is distinct from API-layer progress streaming, which is
      opt-in per request via the `Accept: text/event-stream` header and is
      advertised by `supportsStreaming` in a service's `/health` capabilities.
      A service MAY support either, both, or neither.
  credentials:
    type:
      - object
      - "null"
    description: Optional credentials object to be supplied with time-based key via a proxy.
    additionalProperties: true

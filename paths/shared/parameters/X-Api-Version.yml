in: header
name: X-Api-Version
description: >
  The µEd API version the client is targeting (e.g. "0.1.0"). If omitted, the
  server will use the latest version it supports. If the requested version
  cannot be served, the server returns 406 Version Not Supported.
required: false
schema:
  type: string
  example: "0.1.0"

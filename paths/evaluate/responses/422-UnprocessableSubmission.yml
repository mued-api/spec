description: The request is valid, but the evaluation function cannot process the submission content (e.g. an unparseable expression).
headers:
  X-Request-Id:
    description: Request id for tracing this request across services.
    schema:
      type: string
  X-Api-Version:
    description: The API version that was used to serve this response.
    schema:
      type: string
content:
  application/json:
    schema:
      $ref: "../../shared/schemas/ErrorResponse.yml"
    examples:
      unprocessableSubmission:
        summary: Example unprocessable submission error
        value:
          title: "Unprocessable submission"
          message: "Failed to parse SymPy expression: A/(w*"
          code: "VALIDATION_ERROR"
          trace: null
          details: null

type: object
description: >
  JSON payload of the terminal `event: completed` frame of a `POST /evaluate`
  SSE progress stream. `feedback` is exactly the endpoint's normal
  `200 application/json` body (`EvaluateResponse`); `steps` replays every
  progress step emitted during the stream. `error` MUST NOT be present.
allOf:
  - $ref: "../../shared/schemas/SseTerminalSteps.yml"
  - type: object
    required:
      - feedback
    properties:
      feedback:
        $ref: "./EvaluateResponse.yml"
properties:
  error: false

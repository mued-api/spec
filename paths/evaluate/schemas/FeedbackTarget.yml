type: object
description: Optional reference to a specific part of the submission.
required:
  - format
properties:
  format:
    type: string
    pattern: "^(text|code|math|model|other):[a-z0-9_]+$"
    description: >
      Format of the targeted artefact, matching the submission's format
      (see Submission.format).
  locator:
    type:
      - object
      - "null"
    description: >
      Optional locator into the submission content. Standard locator types:
      - text:*: { type: "span", startIndex: number, endIndex: number }
      - code:*: { type: "range", file?: string, startLine: number, endLine: number, startColumn?: number, endColumn?: number }
      - math:*: { type: "subexpression", path: string } (e.g., path to subexpression)
      - model:*: { type: "element", elementId: string, elementType?: string }
    additionalProperties: true

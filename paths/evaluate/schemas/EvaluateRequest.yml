type: object
description: >
  Input for task evaluate service. The submission is mandatory; task,
  user, criteria, pre-submission feedback options, and
  configuration, and callback URL are optional.
required:
  - submission
properties:
  task:
    description: >
      Optional task context that can include prompt content, learning objectives,
      a reference solution, and additional context metadata.
    type:
      - object
      - "null"
    allOf:
      - $ref: "../../shared/schemas/Task.yml"
  submission:
    $ref: "../../shared/schemas/Submission.yml"
  user:
    description: Optional user information including type and preferences that can influence response tone, detail, and language.
    type:
      - object
      - "null"
    allOf:
      - $ref: "../../shared/schemas/User.yml"
  criteria:
    type:
      - array
      - "null"
    description: Optional criteria used for evaluate.
    items:
      $ref: "./Criterion.yml"
  preSubmissionFeedback:
    description: >
      Optional settings for pre-submission feedback (non-final). When enabled,
      the service should avoid committing or finalizing grades.
    type:
      - object
      - "null"
    allOf:
      - $ref: "./PreSubmissionFeedback.yml"
  callbackUrl:
    type:
      - string
      - "null"
    format: uri
    description: >
      Optional HTTPS callback URL for asynchronous processing. If provided,
      the service may return 202 Accepted immediately and deliver feedback
      results to this URL once processing is complete.
  configuration:
    description: >
      Optional key-value configuration dictionary for provider-specific or
      experimental parameters. Not standardized.
    type:
      - object
      - "null"
    additionalProperties: true
    properties:
      llm:
        description: Optional LLM configuration used for this request.
        type:
          - object
          - "null"
        allOf:
          - $ref: "../../shared/schemas/LLMConfiguration.yml"
      dataPolicy:
        description: Optional data policy governing how this request's data may be processed and retained.
        type:
          - object
          - "null"
        allOf:
          - $ref: "../../shared/schemas/DataPolicy.yml"
      executionPolicy:
        description: Optional execution constraints for this request.
        type:
          - object
          - "null"
        allOf:
          - $ref: "../../shared/schemas/ExecutionPolicy.yml"
      vendorExtensions:
        description: >
          Optional vendor/platform-specific configuration namespaced under
          x-<platform-slug> keys. See VendorExtensions.yml for details.
        $ref: "../../shared/schemas/VendorExtensions.yml"

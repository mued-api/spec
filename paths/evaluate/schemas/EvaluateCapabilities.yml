type: object
description: Capabilities of the evaluate service.
required:
  - supportsEvaluate
  - supportsPreSubmissionFeedback
  - supportsFormativeFeedback
  - supportsSummativeFeedback
  - supportsDataPolicy
additionalProperties: true
allOf:
  - $ref: "../../shared/schemas/StreamingCapabilities.yml"
properties:
  supportsEvaluate:
    type: boolean
    description: Indicates whether the /evaluate endpoint is implemented and usable.
  supportsPreSubmissionFeedback:
    type: boolean
    description: Indicates whether the service supports pre-submission feedback runs.
  supportsFormativeFeedback:
    type: boolean
    description: Indicates whether the service supports qualitative feedback without points.
  supportsSummativeFeedback:
    type: boolean
    description: Indicates whether the service supports feedback with points / grading signals.
  supportsDataPolicy:
    $ref: "../../shared/enums/DataPolicySupport.yml"
  supportedArtefactProfiles:
    type:
      - array
      - "null"
    description: >
      Optional list of supported artefact profiles. Each profile specifies
      a set of supported formats.
    items:
      $ref: "../../shared/schemas/ArtefactProfile.yml"
  supportedLanguages:
    type:
      - array
      - "null"
    description: Optional list of supported language codes (e.g., 'en', 'de').
    items:
      type: string
  supportedAPIVersions:
    type:
      - array
      - "null"
    description: >
      Optional list of µEd API versions supported by this service implementation
      (e.g., ["0.1.0"]). Clients can use this to select a compatible X-Api-Version.
    items:
      type: string

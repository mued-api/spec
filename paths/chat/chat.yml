post:
  summary: Chat about tasks, submissions, or learning topics
  operationId: chat
  description: >
    Conversational endpoint for educational chat use cases. A conversation can be
    grounded in a specific course, task or submission and may use user information
    to adapt tone and detail. Typical use cases include: asking follow-up questions
    on feedback, requesting hints, or clarifying concepts.
  tags:
    - chat
  parameters:
    - $ref: "../shared/parameters/Authorization.yml"
    - $ref: "../shared/parameters/X-Request-Id.yml"
    - $ref: "../shared/parameters/X-Api-Version.yml"
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "./schemas/ChatRequest.yml"
        examples:
          minimalChat:
            summary: Minimal chat request
            value:
              messages:
                - role: USER
                  content: "Can you explain polymorphism?"
              configuration: null

          minimalChatAsynchronous:
            summary: Asynchronous minimal chat request
            value:
              messages:
                - role: USER
                  content: "Can you explain polymorphism?"
              configuration: null
              callbackUrl: "https://learning-platform.example.com/hooks/chat-result"

          chatWithLlmConfig:
            summary: Chat request with optional LLM configuration
            value:
              conversationId: "conv-1001"
              user:
                userId: "user-456"
                type: LEARNER
                preference:
                  detail: MEDIUM
                  tone: FRIENDLY
                  language: "en"
              messages:
                - role: USER
                  content: "Give me a hint for my answer about polymorphism."
              context:
                task:
                  taskId: "task-12"
                  title: "Explain polymorphism"
                  content:
                    text: "Define polymorphism and give at least one example in Java."
              configuration:
                type: "Java Assistant"
                llm:
                  model: "gpt-5.2"
                  temperature: 0.7
                  stream: false
                  credentials:
                    type: "JWT"
                    key: "Some-Key"
          chatWithContext:
            summary: Chat request with complex educational context
            value:
              messages:
                - role: USER
                  content: "What should I do for this part?"
              user:
                userId: "user-321"
                type: LEARNER
                preference:
                  detail: DETAILED
                  tone: NEUTRAL
                  language: "en"
                taskProgress:
                  currentQuestionId: "question-321"
                  timeSpentOnQuestion: "30 minutes"
                  currentPart:
                    partId: "part-1"
                    timeSpentOnPart: "10 minutes"
                    submission:
                      format: "text:plain"
                      content:
                        value: 'outputs= ["Woof!", "Meow!"]'
                      feedback:
                        - feedbackId: "fb-101"
                          message: "Incomplete answer, explain why these outputs occur."
              context:
                module:
                  moduleId: "module-456"
                  title: "Introduction to Object-Oriented Programming (OOP)"
                set:
                  setId: "set-789"
                  title: "Fundamentals"
                question:
                  questionId: "question-321"
                  title: "Understanding Polymorphism"
                  content: >
                    Answer the questions for the following example of polymorphism in Python.

                    ```python
                    class Animal:
                        def speak(self):
                            pass

                    class Dog(Animal):
                        def speak(self):
                            return "Woof!"

                    class Cat(Animal):
                        def speak(self):
                            return "Meow!"

                    animals = [Dog(), Cat()]
                    for animal in animals:
                        print(animal.speak())
                    ```
                  estimatedTime: "15-25 minutes"
                  parts:
                    - partId: "part-1"
                      content: >
                        Looking at the code example, identify which method is being overridden
                        and explain how this demonstrates polymorphism. What output would the
                        code produce and why?

                    - partId: "part-2"
                      content: >
                        Write a new class called `Bird` that inherits from `Animal` and
                        overrides the `speak()` method to return "Tweet!". Then add an
                        instance of `Bird` to the animals list.
                      referenceSolution:
                        code: |
                          class Bird(Animal):
                              def speak(self):
                                  return "Tweet!"

                          animals = [Dog(), Cat(), Bird()]
                          for animal in animals:
                              print(animal.speak())
              configuration:
                type: "CS Assistant"
                llm:
                  model: "gpt-5.2"
                  temperature: 0.5
  responses:
    "200":
      description: >
        Successful chat response.


        ### Response selection


        The service picks the response mode in this order:


        1. Errors detected before any response bytes are sent (validation,
           authorization, unsupported version, unimplemented operation, etc.)
           are returned with their normal HTTP status and an `ErrorResponse`
           JSON body. No stream is opened.

        2. A request that sets `callbackUrl` **and** sends
           `Accept: text/event-stream` is rejected with `400`; asynchronous
           callback delivery and SSE streaming are mutually exclusive.

        3. A request that sets `callbackUrl` MAY be answered with `202` and
           the result delivered to the callback.

        4. A request that sends `Accept: text/event-stream` to a service that
           advertises `supportsStreaming` receives a `200` Server-Sent Events
           progress stream (`text/event-stream`, see below).

        5. Otherwise, including when the service does not support streaming,
           the response is `200 application/json`.


        ### Streaming variant (opt-in)


        Each item of the `text/event-stream` body is one SSE event, described
        by `itemSchema`:


        - zero or more progress events, where `event:` is the stage name (e.g.
          `preparing`, `thinking`) and `data:` is an `SseProgressStep` JSON object;

        - optional keep-alive comment lines (each starting with `:`), which
          are not events;

        - exactly one terminal event: `event: completed` with `data:`
          an `SseChatCompletedFrame` (the `200` `ChatResponse` body, plus a
          `steps` replay), or `event: failed` with `data:` an
          `SseFailedFrame` (an `ErrorResponse` under `error`, plus `steps`).


        `completed` and `failed` are reserved terminal event names and are
        never used as progress stages. Once the stream has opened the `200`
        status is committed, so any failure after that point is delivered as
        the terminal `failed` event. `X-Request-Id` and `X-Api-Version` are
        sent once, as response headers, when the stream opens. This is
        independent of `configuration.llm.stream`, which governs token-level
        streaming from the LLM provider.
      headers:
        X-Request-Id:
          description: Request id for tracing this request across services.
          schema:
            type: string
        X-Api-Version:
          description: The API version that was used to serve this response.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "./schemas/ChatResponse.yml"
          examples:
            minimalChat:
              summary: Minimal chat response
              value:
                output:
                  role: ASSISTANT
                  content: >
                    Polymorphism is a core concept in object-oriented programming that allows
                    objects of different classes to be treated as objects of a common superclass.
                    It enables a single interface to represent different underlying forms (data types).
                    For example, in Java, you can have a superclass `Animal` with a method `speak()`,
                    and subclasses like `Dog` and `Cat` that provide their own implementations of `speak()`.
                    When you call `speak()` on an `Animal` reference, the appropriate subclass method is invoked
                    based on the actual object type at runtime.
                metadata: null
            chatWithLlmConfig:
              summary: Chat response with LLM configuration
              value:
                output:
                  role: ASSISTANT
                  content: >
                    Here's a hint for your answer about polymorphism: Focus on how polymorphism
                    allows methods to do different things based on the object that it is acting upon,
                    even when accessed through a common interface. You might want to mention method
                    overriding and how it enables this behavior in object-oriented programming.
                metadata:
                  responseTimeMs: 1800
                  type: "Java Assistant"
                  createdAt: "2025-12-10T11:15:00Z"
                  llm:
                    model: "gpt-5.2"
                    temperature: 0.7
                    outputTokens: 78
            chatWithContext:
              summary: Chat response with context
              value:
                output:
                  role: ASSISTANT
                  content: >
                    In the provided code example, the `speak()` method is being overridden
                    in the `Dog` and `Cat` subclasses of the `Animal` superclass. This demonstrates
                    polymorphism because when we call `speak()` on each animal in the `animals` list,
                    the method that gets executed depends on the actual object type (either `Dog` or `Cat`),
                    not the reference type (`Animal`). The output of the code would be:

                    ```
                    Woof!
                    Meow!
                    ```

                    This happens because each subclass provides its own implementation of the `speak()` method,
                    and at runtime, the correct method is called based on the object's type.
                metadata:
                  responseTimeMs: 2000
                  type: "CS Assistant"
                  createdAt: "2025-12-10T11:15:00Z"
                  llm:
                    model: "gpt-5.2"
                    temperature: 0.5
                    outputTokens: 143
        text/event-stream:
          itemSchema:
            $ref: "./schemas/SseChatEvent.yml"
          examples:
            completedStream:
              summary: Progress events, a keep-alive comment, then the terminal `completed` event
              serializedValue: |
                event: preparing
                data: {"stage":"preparing","message":"Preparing worker","timestamp":"2025-12-10T11:15:00Z"}

                : keep-alive

                event: thinking
                data: {"stage":"thinking","message":"Composing response","timestamp":"2025-12-10T11:15:02Z"}

                event: completed
                data: {"output":{"role":"ASSISTANT","content":"Polymorphism lets one interface represent many underlying forms."},"metadata":{"responseTimeMs":1800},"steps":[{"stage":"preparing","message":"Preparing worker","timestamp":"2025-12-10T11:15:00Z"},{"stage":"thinking","message":"Composing response","timestamp":"2025-12-10T11:15:02Z"}]}

            failedStream:
              summary: A progress event, then the terminal `failed` event (HTTP status is still 200)
              serializedValue: |
                event: preparing
                data: {"stage":"preparing","message":"Preparing worker","timestamp":"2025-12-10T11:15:00Z"}

                event: failed
                data: {"error":{"title":"Chat failed","message":"The LLM provider connection failed.","code":"LLM_PROVIDER_ERROR"},"steps":[{"stage":"preparing","message":"Preparing worker","timestamp":"2025-12-10T11:15:00Z"}]}

    "202":
      $ref: "./responses/202-Accepted.yml"
    "400":
      $ref: "./responses/400-BadRequest.yml"
    "403":
      $ref: "./responses/403-Forbidden.yml"
    "500":
      $ref: "./responses/500-InternalError.yml"
    "406":
      $ref: "./responses/406-VersionNotSupported.yml"
    "501":
      $ref: "./responses/501-NotImplemented.yml"

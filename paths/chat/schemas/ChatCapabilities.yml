type: object
description: Capabilities of the chat service.
required:
  - supportsChat
  - supportsDataPolicy
additionalProperties: true
properties:
  supportsChat:
    type: boolean
    description: Indicates whether the /chat endpoint is implemented and usable.
  supportsUserPreferences:
    type: boolean
    description: Indicates whether the service supports adapting to user preferences.
  supportsStreaming:
    type: boolean
    description: Indicates whether the service supports streaming responses.
  supportsDataPolicy:
    $ref: "../../shared/enums/DataPolicySupport.yml"
  supportedLanguages:
    type:
      - array
      - "null"
    description: Optional list of supported language codes.
    items:
      type: string
  supportedModels:
    type:
      - array
      - "null"
    description: Optional list of supported models.
    items:
      type: string
  supportedAPIVersions:
    type:
      - array
      - "null"
    description: >
      Optional list of µEd API versions supported by this service implementation
      (e.g., ["0.1.0"]). Clients can use this to select a compatible X-Api-Version.
    items:
      type: string

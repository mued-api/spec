get:
  summary: Health of the chat service
  operationId: getChatHealth
  description: >
    Returns health of the chat service.
    Clients can use this endpoint to discover whether the service is healthy
  tags:
    - chat
  parameters:
    - $ref: "../shared/parameters/X-Request-Id.yml"
    - $ref: "../shared/parameters/X-Api-Version.yml"
  responses:
    "200":
      description: Chat service is reachable and reporting healthy.
      headers:
        X-Request-Id:
          description: Request id for tracing this request across services.
          schema:
            type: string
        X-Api-Version:
          description: The API version that was used to serve this response.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "./schemas/ChatHealthResponse.yml"
          examples:
            exampleHealth:
              summary: Example healthy service with capabilities
              value:
                status: "OK"
                statusMessage: "Service healthy"
                version: "1.0.0"
    "406":
      $ref: "./responses/406-VersionNotSupported.yml"
    "501":
      description: The server does not implement the health endpoint for chat.
      $ref: "./responses/501-NotImplemented.yml"
    "503":
      $ref: "./responses/503-ServiceUnavailable.yml"
